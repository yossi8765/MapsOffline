# MapsOffline CI: only the weekly ready-made data package (tools/ci-data.sh).
# Runs on the pipeline schedule ("CI/CD > Schedules") or when started by hand (Run pipeline);
# pushes do not start pipelines. Releases are still built on Windows with tools/release.ps1.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"

data-package:
  image: rust:1-bookworm
  timeout: 3h
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
    CARGO_TERM_COLOR: never
    RUST_LOG: info
  cache:
    key: data-cargo-registry-v1
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache
  before_script:
    - apt-get update -qq
    # Tauri's Linux libraries (the data tool lives in the app crate) + tools for the script
    - >
      apt-get install -y -qq --no-install-recommends
      libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      libssl-dev pkg-config file jq ca-certificates > /dev/null
  script:
    - bash tools/ci-data.sh
