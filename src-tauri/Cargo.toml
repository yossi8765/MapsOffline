[package]
name = "mapsoffline"
version = "2.0.8"
description = "MapsOffline - offline navigation and maps for Israel"
authors = ["MapsOffline"]
edition = "2021"
default-run = "mapsoffline"

[lib]
name = "mapsoffline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mapsoffline"
path = "src/main.rs"

[[bin]]
name = "mapsoffline-data"
path = "src/bin/mapsoffline-data.rs"
# The data CLI is a developer tool. Gating it behind a feature keeps it out of
# `cargo build --bins` (what `tauri build` runs) and therefore out of the installer,
# which otherwise bundles every [[bin]] (~5-7 MB). Use:
#   cargo run --release --features cli --bin mapsoffline-data -- <args>
required-features = ["cli"]

[features]
cli = ["dep:clap"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# One running window: a second start (or a mapsoffline:// / geo: link) is handed to it.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
osmpbf = "0.3"
# osmChange (daily diff) parsing for incremental OSM updates
quick-xml = "0.42"
# Only the blocking client (online routing, tiles metadata) and the async client with
# chunk() reads (downloads) are used; "stream" (bytes_stream/wrap_stream) is not.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "blocking"] }
# download.rs builds a current_thread runtime and uses tokio::time::timeout.
tokio = { version = "1", features = ["rt", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
csv = "1.3"
# Deflate only (flate2/miniz_oxide). The zopfli encoder it drags in is only reachable from
# ZipWriter (tests), so LTO removes it from the shipped binary.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Already in the tree via zip; used directly for PMTiles directories (satellite) and package compression.
flate2 = "1"
# Decoding Terrarium DEM tiles for elevation profiles (decoder only is used; the encoder only in tests).
png = "0.17"
# Mapterhorn DEM tiles are lossless WebP (Terrarium): pure-Rust decoder for elevation profiles.
image-webp = "0.2"
# govmap orthophoto: decode the ITM source tiles, encode the reprojected WebMercator tiles (pure Rust).
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = "0.6"
# In-app update: Ed25519 signature of the release checksum list + SHA-256 of the download.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"

chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = { version = "0.10", features = ["filter-by-regex"] }
# OSM opening_hours of points of interest ("open now", closing time); ~200 KB in the exe
# (measured: a minimal opt-level "s" + LTO binary grew from 127 to 332 KB).
opening-hours = { version = "2.1.4", default-features = false }
anyhow = "1"
log = "0.4"
# No regex filter syntax / ANSI auto-colour (RUST_LOG=module=level still works).
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
rstar = "0.12"
rayon = "1"
rustc-hash = "2"
# OsmAnd .obf import: the (multi-GB) file is memory-mapped (already in the tree via other crates)
memmap2 = "0.5"
clap = { version = "4", optional = true, default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
dirs = "6"
unicode-normalization = "0.1"
parking_lot = "0.12"
smallvec = "1"
# [R1] deps
# Remembers size, position and maximised state of the windows.
tauri-plugin-window-state = "2"
# MD5 of the Geofabrik extract (Geofabrik publishes <file>.md5 next to it); same digest traits as sha2.
md-5 = "0.10"
# Voice input (speech.rs): whisper.cpp, built from source with CMake; bindgen needs libclang
# (LIBCLANG_PATH). The ivrit-ai Hebrew model is optional data in <data>/speech/.
whisper-rs = "0.16"
# [R2] deps
# [R3] deps
# [R4] deps


# Windows only. This section must stay last among the dependency lists: every line below a
# [target] header belongs to it (chrono & co. once landed here and broke Linux builds).
# Linux: location from GeoClue over D-Bus (zbus is already in the tree through Tauri)
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", features = ["blocking-api"] }

[target.'cfg(windows)'.dependencies]
# WinRT Geolocator for "my location" (system consent dialog, no browser prompt).
# Navigation: text-to-speech (SpeechSynthesis) played through MediaPlayer, WinRT init per thread.
windows = { version = "0.58", features = ["Devices_Geolocation", "Foundation", "Foundation_Collections", "Media_SpeechSynthesis", "Media_Playback", "Media_Core", "Storage_Streams", "Win32_System_WinRT", "UI", "UI_ViewManagement", "Win32_Storage_FileSystem"] }

# Size/speed tuned, see docs/SIZE.md. opt-level "s" was measured equal to 3 for routing
# (A*, alternatives) and graph load; only SQLite (FTS5 search) lost ~15-50 % at -Os,
# so the SQLite C code and its Rust wrapper stay at 3. "z" slowed routing ~28 % (rejected).
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true
debug = false
incremental = false

[profile.release.package.libsqlite3-sys]
opt-level = 3

[profile.release.package.rusqlite]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
